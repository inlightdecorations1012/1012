
# EUR/USD Forex Parquet Converter Configuration v13.4
# ==================================================
# v13.4 Changes:
# - Added data_version field for dynamic version handling
# - Added checksum_mode for flexible file verification
# - Added calendar option for enhanced holiday detection
# - Added configurable validation thresholds (spread_multiplier, spread_floor, atr_grid_*)
# - Preserve mode validation (flag invalid data instead of dropping)
# - Dynamic ATR multipliers (target 3% minority class)
# - Tighter merge tolerance (0.1 instead of 0.5)

# Data version (used throughout the pipeline)
data_version: "13.4"

# File paths
paths:
  input: "/content/drive/MyDrive/ForexBotPodaci/raw_data"
  output: "/content/drive/MyDrive/ForexBotPodaci/parquet_v13"

# Logging configuration
logging:
  level: "INFO"
  save_to_file: true

# Processing configuration
processing:
  parallel_enabled: false  # Now safe with file locking
  max_workers: 2
  chunk_size: 100000
  stream_read: true
  partitioning_enabled: true
  # v13.4: Tighter merge tolerance for better BID/ASK alignment
  merge_tolerance_multiplier: 0.1  # Reduced from 0.5
  # v13.4: Checksum mode for file verification
  checksum_mode: "metadata"  # Options: "metadata" (fast) or "content" (thorough)
  # v13.4: Calendar for holiday detection
  calendar: "basic"  # Options: "basic" (Christmas/NY only) or "full" (US+UK holidays)

# Quality control thresholds
quality_control:
  min_rows_per_timeframe: 500
  max_spread_pct: 0.01  # Will be overridden by dynamic calculation
  min_spread_pct: 0.00001
  max_time_gap_multiplier: 5.0
  max_class_imbalance_ratio: 20.0
  # v13.4: Preserve mode - flag invalid data instead of dropping
  validation_mode: "preserve"  # Options: "drop" or "preserve"
  # v13.4: Configurable validation thresholds
  spread_multiplier: 4.0  # Multiplier for dynamic spread filter
  spread_floor: 0.002  # Minimum spread threshold
  atr_grid_start: 0.1  # Start of ATR multiplier grid search
  atr_grid_stop: 5.0  # End of ATR multiplier grid search
  atr_grid_step: 0.1  # Step size for ATR grid search

# Debug options
debug:
  save_intermediate_csvs: false
  limit_rows: null  # Set to number to limit rows for testing
  verbose_logging: false

# Feature engineering parameters (defaults)
features:
  technical_basic:
    ma_periods: [20, 50]
    rsi_period: 14
  technical_advanced:
    bb_period: 20
    bb_std: 2
  volatility_basic:
    window: 20
  attention_hints:
    window: 20

# Timeframe configurations
timeframes:
  - name: "15min"
    file_pattern: "EURUSD_Candlestick_15_M_"
    frequency: "15T"
    timezone: "UTC"
    chunk_size: 50000
    enabled_features:
      - "technical_basic"
      - "technical_advanced"
      - "microstructure_basic"
      - "temporal_basic"
      - "session_basic"
      - "volatility_basic"
      - "transformer_specific"
      - "attention_hints"
      - "price_action"
    target:
      type: "multi_horizon"
      lookahead_periods: 12
      atr_multiplier: 0.5  # Initial value, will be dynamic
      multi_horizon: [1, 3, 6, 12]
      use_soft_labels: true
      # v13.4: Dynamic ATR calculation
      dynamic_atr_multiplier: true
      target_minority_class_pct: 0.03  # Target 3% minority class
    normalization:
      method: "zscore"
      window: 504
      min_periods: 50

  - name: "1hour"
    file_pattern: "EURUSD_Candlestick_1_Hour_"
    frequency: "1H"
    timezone: "UTC"
    chunk_size: 50000
    enabled_features:
      - "technical_basic"
      - "technical_advanced"
      - "microstructure_basic"
      - "temporal_basic"
      - "session_basic"
      - "volatility_basic"
      - "transformer_specific"
      - "attention_hints"
      - "price_action"
    target:
      type: "multi_horizon"
      lookahead_periods: 24
      atr_multiplier: 0.8  # Initial value, will be dynamic
      multi_horizon: [1, 4, 8, 16, 24]
      use_soft_labels: true
      # v13.4: Dynamic ATR calculation
      dynamic_atr_multiplier: true
      target_minority_class_pct: 0.03
    normalization:
      method: "zscore"
      window: 504
      min_periods: 100

  - name: "4hour"
    file_pattern: "EURUSD_Candlestick_4_Hour_"
    frequency: "4H"
    timezone: "UTC"
    chunk_size: 50000
    enabled_features:
      - "technical_basic"
      - "technical_advanced"
      - "microstructure_basic"
      - "temporal_basic"
      - "session_basic"
      - "volatility_basic"
      - "transformer_specific"
      - "attention_hints"
      - "price_action"
    target:
      type: "multi_horizon"
      lookahead_periods: 48
      atr_multiplier: 1.2  # Initial value, will be dynamic
      multi_horizon: [1, 3, 6, 12, 24]
      use_soft_labels: true
      # v13.4: Dynamic ATR calculation
      dynamic_atr_multiplier: true
      target_minority_class_pct: 0.03
    normalization:
      method: "zscore"
      window: 504
      min_periods: 100

  - name: "daily"
    file_pattern: "EURUSD_Candlestick_1_D_"
    frequency: "1D"
    timezone: "UTC"
    chunk_size: 50000
    # Note: Fewer features for daily - no session features
    enabled_features:
      - "technical_basic"
      - "technical_advanced"
      - "microstructure_basic"
      - "temporal_basic"
      - "volatility_basic"
      - "transformer_specific"
      - "price_action"
    target:
      type: "multi_horizon"
      lookahead_periods: 60
      atr_multiplier: 1.8  # Initial value, will be dynamic
      multi_horizon: [1, 5, 10, 20, 40]
      use_soft_labels: true
      # v13.4: Dynamic ATR calculation
      dynamic_atr_multiplier: true
      target_minority_class_pct: 0.03
    normalization:
      method: "zscore"
      window: 504
      min_periods: 200

  - name: "weekly"
    file_pattern: "EURUSD_Candlestick_1_W_"
    frequency: "1W"
    timezone: "UTC"
    chunk_size: 50000
    # Note: Minimal features for weekly
    enabled_features:
      - "technical_basic"
      - "microstructure_basic"
      - "temporal_basic"
      - "volatility_basic"
      - "transformer_specific"
    target:
      type: "multi_horizon"
      lookahead_periods: 52
      atr_multiplier: 2.5  # Initial value, will be dynamic
      multi_horizon: [1, 4, 8, 13, 26]
      use_soft_labels: true
      # v13.4: Dynamic ATR calculation
      dynamic_atr_multiplier: true
      target_minority_class_pct: 0.03
    normalization:
      method: "zscore"
      window: 260
      min_periods: 52
